# ChronosLOB full-audit smoke configuration.
# This is a local repository audit only. It does not train models, download data,
# contact GitHub, run live exchange clients or produce benchmark results.

experiment_type: full_audit_ci_hardening
release_track: audit_ci_hardening
audit_root: "."
strict: false
large_file_threshold_bytes: 1000000

forbidden_claim_groups:
  unsupported_performance_claims: true
  unsupported_execution_claims: true
  unsupported_public_positioning: true

expected_docs:
  - docs/CLI_REFERENCE.md
  - docs/PROJECT_STATUS.md
  - docs/REPRODUCIBILITY.md
  - docs/SAFETY_AND_LIMITATIONS.md

expected_reports:
  - reports/limitations.md
  - reports/full_audit_ci_hardening.md

expected_ci:
  - .github/workflows/ci.yml

checks:
  required_paths: true
  cli_inventory: true
  config_inventory: true
  report_inventory: true
  forbidden_claims: true
  synthetic_fixture_labelling: true
  large_generated_files: true
  public_release_wording: true

notes:
  - "Synthetic fixtures exercise code paths only."
  - "This audit performs local repository checks and does not contact external services."
  - "CI installs the optional torch extra because existing tests cover torch-backed modules."

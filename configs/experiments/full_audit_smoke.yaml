# ChronosLOB Phase 18 full-audit smoke configuration.
# This is a local repository audit only. It does not train models, download data,
# contact GitHub, run live exchange clients or produce benchmark results.

experiment_type: full_audit_ci_hardening
phase: 18
audit_root: "."
strict: false
large_file_threshold_bytes: 1000000

forbidden_claims:
  - guaranteed alpha
  - guaranteed profit
  - beats the market
  - deployable trading strategy
  - production trading system
  - live trading bot
  - risk-free
  - high Sharpe
  - proven profitable

expected_docs:
  - docs/CLI_REFERENCE.md
  - docs/PROJECT_STATUS.md
  - docs/REPRODUCIBILITY.md
  - docs/SAFETY_AND_LIMITATIONS.md

expected_reports:
  - reports/limitations.md
  - reports/full_audit_ci_hardening.md

expected_ci:
  - .github/workflows/ci.yml

checks:
  required_paths: true
  cli_inventory: true
  config_inventory: true
  report_inventory: true
  forbidden_claims: true
  synthetic_fixture_labelling: true
  large_generated_files: true

notes:
  - "Synthetic fixtures and smoke outputs are plumbing checks only."
  - "This audit does not create benchmark evidence, execution evidence or model results."
  - "No live trading, broker integration, venue API client or hidden network call is configured."
  - "The CI installs the optional torch extra because existing tests cover torch-backed modules."

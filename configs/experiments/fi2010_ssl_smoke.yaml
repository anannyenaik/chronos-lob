# FI-2010 self-supervised pretraining + fine-tuning smoke configuration.
#
# This is a tiny CPU smoke configuration for the ssl_transformer path, not a
# benchmark-quality run. It reuses the neural benchmark config schema so the
# fine-tuned and supervised-baseline matrix transformers share one architecture.
# It does not claim self-supervised effectiveness; SSL rows are only ever
# admitted to the final report when valid SSL artefacts are generated.
#
# Use it with synthetic fixtures or tiny local inputs to exercise code paths
# only. Fixture-scale outputs are synthetic code-path checks, not FI-2010
# benchmark evidence.

study_name: fi2010_ssl_smoke

dataset:
  name: FI-2010
  source: local official NoAuction ZScore fold CSVs prepared by prepare-fi2010-multifold
  assumptions:
    - Prepared inputs contain one split-aware combined CSV per official fold.
    - The split column preserves official train and test membership.
    - Self-supervised pretraining consumes official training rows only.
    - The validation pretraining loss is carved from official training rows.
    - Official test rows are held out from pretraining, fitting and validation.
    - Raw and processed FI-2010 files stay in ignored local directories.
  local_data_only: true
  raw_data_committed: false
  processed_csv_committed: false

official_split:
  split_column: split
  train_value: train
  test_value: test
  validation_fraction_within_train: 0.15
  validation_source: tail_of_official_train
  test_usage: final_evaluation_only

folds:
  - fold_1

seeds:
  - 0

target:
  horizon: 10
  label_column: label_10

neural_models:
  matrix_transformer:
    enabled: true
    architecture: transformer encoder over normalised matrix windows, shared by SSL and baseline
    hidden_sizes: [32]
    model_dim: 16
    num_heads: 2
    num_layers: 1
    feedforward_dim: 32
    dropout: 0.0

lookbacks:
  - 10

training:
  batch_size: 16
  max_epochs: 2
  early_stopping_patience: 1
  early_stopping_metric: validation_macro_f1
  learning_rate: 0.001
  weight_decay: 0.0
  gradient_clip_norm: 1.0
  dropout: 0.0

device_selection: cpu

deterministic_seed_handling:
  enabled: true
  seed_source: configured_seed_list
  set_python_numpy_torch: true
  deterministic_torch_algorithms: true

validation_metric: macro_f1

checkpoint_policy:
  enabled: true
  save_best_only: true
  filename: best_model.pt
  write_by_default: false

artefacts:
  output_root: runs/fi2010_ssl/runs
  checkpoint_root: runs/fi2010_ssl/checkpoints
  summary: summary.json
  run_plan: run_plan.csv
  results_by_fold_seed: results_by_fold_seed.csv
  results_summary: results_summary.csv
  training_summary: training_summary.csv
  model_capacity_summary: model_capacity_summary.csv
  model_failures: model_failures.json
  write_full_predictions_by_default: true
  write_checkpoints_by_default: false

mode: smoke
benchmark_note: >
  Tiny CPU smoke configuration for the SSL pretraining and fine-tuning path.
  Use it to exercise the ssl_transformer code path; it is not a benchmark run
  and makes no self-supervised effectiveness claim.

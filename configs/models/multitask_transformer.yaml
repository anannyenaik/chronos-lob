# ChronosLOB Phase 14 multi-task transformer model config.
# This is supervised fine-tuning infrastructure only. Actual task availability
# depends on leakage-safe labels produced outside tokenisation.

model_type: multitask_transformer
freeze_backbone: false
dropout: 0.1

backbone:
  architecture: market_transformer_encoder
  field_embedding_dim: 8
  model_dim: 32
  num_heads: 4
  num_layers: 2
  feedforward_dim: 64
  dropout: 0.1
  max_sequence_length: 64
  pooling: mean
  activation: gelu
  use_layer_norm: true
  pad_token_id: 0

tasks:
  - name: direction
    task_type: classification
    num_classes: 3
    loss_weight: 1.0
    ignore_index: -100
  - name: return_quantile
    task_type: classification
    num_classes: 5
    loss_weight: 1.0
    ignore_index: -100
  - name: volatility_regime
    task_type: classification
    num_classes: 3
    loss_weight: 1.0
    ignore_index: -100
  - name: spread_widening
    task_type: classification
    num_classes: 2
    loss_weight: 1.0
    ignore_index: -100
  - name: fill_probability
    task_type: classification
    num_classes: 2
    loss_weight: 1.0
    ignore_index: -100
  - name: adverse_selection
    task_type: classification
    num_classes: 2
    loss_weight: 1.0
    ignore_index: -100

notes:
  - "Labels must be generated outside tokenisation and aligned by token window end position."
  - "This config does not imply calibration, execution simulation, backtesting or alpha evidence."
